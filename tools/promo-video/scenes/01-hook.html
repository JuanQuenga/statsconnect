<!doctype html>
<html><head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../lib/stage.css">
  <script src="../lib/stage.js"></script>
  <style>
    #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #bg { position: absolute; inset: 0; overflow: hidden; }
    #art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
    .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,24,56,.92) 0%, rgba(11,24,56,.15) 32%, rgba(11,24,56,.1) 62%, rgba(11,24,56,.92) 100%); }
    .hero { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; transform-origin: 50% 50%; opacity: 0; z-index: 2; }
    .char { position: absolute; top: 1200px; width: 560px; height: 560px; opacity: 0; transform-origin: 50% 50%; filter: drop-shadow(0 14px 0 var(--ink)); }
    .ray { position: absolute; left: 540px; top: 820px; width: 900px; height: 36px; margin-top: -18px; transform-origin: 0 50%; opacity: 0; z-index: 1;
      background: linear-gradient(90deg, var(--gold-top) 0%, var(--gold-top) 40%, rgba(255,210,31,0) 100%); }
    #mark { position: absolute; left: 390px; top: 670px; width: 300px; height: 300px; transform-origin: 50% 50%; z-index: 1; filter: drop-shadow(0 14px 0 var(--ink)); }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  </style>
</head><body>
  <div id="stage">
    <div id="cam">
      <div id="bg">
        <img id="art" src="../assets/img/hub-worlds-2026-mobile.webp" alt="">
        <div class="veil"></div>
      </div>
      <img id="cosmo" class="char" src="../assets/img/cosmo-bust.png" alt="" style="left: -60px;">
      <img id="ronin" class="char" src="../assets/img/ronin-bust.png" alt="" style="left: 580px;">
      <div id="two" class="hero brawl-type gold" style="top: 150px; font-size: 210px;">TWO<br>GAMES.</div>
      <div id="one" class="hero brawl-type cyan" style="top: 1200px; font-size: 250px;">ONE<br>HUB.</div>
      <img id="mark" src="../assets/img/statsconnect-mark.png" alt="">
    </div>
    <div id="flash"></div>
  </div>
  <script>
    window.SCENE = {
      beats: 8,
      sfx: [
        { beat: 0, name: "slam", gain: 0.8 },
        { beat: 2, name: "punch" },
        { beat: 2.5, name: "punch" },
        { beat: 4, name: "slam" },
        { beat: 6, name: "pop" },
        { beat: 6.25, name: "sparkle", gain: 0.5 },
        { beat: 7.5, name: "whoosh" },
      ],
    };
    const { BEAT, beats, range, ease, pop, hit, shake, lerp, clamp } = Stage;
    const B = (n) => beats(n);
    const DUR = B(8);
    // Screen-shake kicks: [time, amplitude px]
    const KICKS = [[0, 22], [B(2), 10], [B(2.5), 8], [B(4), 18], [B(6), 12]];
    // Beat hits used for the background brightness pulse.
    const PULSES = [0, 1, 2, 3, 4, 5, 6, 7].map((k) => B(k));

    const $ = (id) => document.getElementById(id);
    const cam = $("cam"), art = $("art"), two = $("two"), one = $("one");
    const cosmo = $("cosmo"), ronin = $("ronin"), mark = $("mark"), flash = $("flash");

    // Twelve gold rays radiating from the logo centre.
    const rays = Array.from({ length: 12 }, (_, i) => {
      const d = document.createElement("div");
      d.className = "ray";
      d.dataset.angle = String(i * 30 + 15);
      cam.insertBefore(d, mark);
      return d;
    });

    // Slam: starts at `from` scale and lands on 1 with a small overshoot.
    const slam = (t, at, dur, from) => ({
      s: from + (1 - from) * ease.outBack(range(t, at, at + dur), 1.6),
      o: t >= at ? 1 : 0,
    });

    window.seek = (t) => {
      // Camera: shake on every hit, then a hard scale-up into the lens at the exit.
      let amp = 0;
      for (const [at, a] of KICKS) amp += a * hit(t, at, 0.22);
      const sh = shake(t, amp);
      const exit = ease.inCubic(range(t, B(7.5), DUR));
      cam.style.transform = `translate(${sh.x}px, ${sh.y}px) scale(${1 + 0.6 * exit})`;

      // Background: push-in across the scene, plus a brightness pulse on every beat.
      art.style.transform = `scale(${lerp(1.08, 1.25, clamp(t / DUR))})`;
      let pulse = 0;
      for (const at of PULSES) pulse += hit(t, at, 0.2);
      art.style.filter = `brightness(${1 + 0.12 * Math.min(pulse, 1)})`;

      // Headlines (both centred on the same stroke and size).
      const a = slam(t, -0.15, 0.5, 2.6);
      two.style.opacity = a.o;
      two.style.transform = `scale(${a.s})`;
      const b = slam(t, B(4), 0.5, 2.6);
      one.style.opacity = b.o;
      one.style.transform = `translateY(-50%) scale(${b.s})`;

      // Characters punch in from below and stay on screen through the end.
      const cp = range(t, B(2), B(2) + 0.35);
      const rp = range(t, B(2.5), B(2.5) + 0.35);
      const rise = (1 - ease.outBack(cp, 1.8)) * 700;
      cosmo.style.opacity = t >= B(2) ? 1 : 0;
      cosmo.style.transform = `translateY(${rise}px) rotate(-8deg)`;
      ronin.style.opacity = t >= B(2.5) ? 1 : 0;
      ronin.style.transform = `translateY(${(1 - ease.outBack(rp, 1.8)) * 700}px) rotate(8deg)`;

      // Logo and rays.
      const mp = pop(t, B(6), 0.3);
      mark.style.transform = `scale(${mp})`;
      const burst = ease.outExpo(range(t, B(6), B(6) + 0.4));
      const fade = 1 - 0.1 * range(t, B(7), DUR);
      for (const d of rays) {
        d.style.transform = `rotate(${d.dataset.angle}deg) scaleX(${burst})`;
        d.style.opacity = fade;
      }

      // Flash: pulse at the opening hit, the headline slam and the logo hit, then a white exit to 0.8.
      const f = Math.max(
        hit(t, 0, 0.12) * 0.55,
        hit(t, B(4), 0.1) * 0.3,
        hit(t, B(6), 0.15) * 0.7,
        range(t, B(7.5), DUR) * 0.8,
      );
      flash.style.opacity = f;
    };
  </script>
</body></html>
